<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border-radius:8px;">
          <tr>
            <td style="padding:24px 28px; border-bottom:1px solid #e5e7eb;">
              <p style="margin:0; font-size:20px; font-weight:bold; color:#111827;">{{ tienda }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 16px 0; font-size:22px; color:#111827;">{% block titulo_visible %}{% endblock %}</h1>
              {% block contenido %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px; border-top:1px solid #e5e7eb; font-size:13px; color:#4b5563;">
              {% block pie %}
              Puedes revisar el estado de tu pedido en
              <a href="{{ url_seguimiento }}" style="color:#1d4ed8;">el portal de seguimiento</a>
              con tu número de orden (#{{ orden.id }}) y este correo.
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
